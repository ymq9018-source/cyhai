name: Cyhai Android build

on:
  workflow_dispatch:
  push:
    branches: [pocketpal-rebuild]

permissions:
  contents: read

concurrency:
  group: cyhai-pocketpal-rebuild
  cancel-in-progress: false

jobs:
  bootstrap-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'bootstrap Cyhai from PocketPal') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Cyhai bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: pocketpal-rebuild
          fetch-depth: 0

      - name: Prepare PocketPal source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/a-ghorbani/pocketpal-ai.git "$RUNNER_TEMP/pocketpal"
          bash "$GITHUB_WORKSPACE/scripts/apply-cyhai-branding.sh" "$RUNNER_TEMP/pocketpal"
          # CI-only Firebase placeholder: PocketPal uses Firebase solely for opt-in benchmark uploads.
          # This allows local/offline app features to build; real benchmark uploads need the owner's Firebase config.
          cat > "$RUNNER_TEMP/pocketpal/android/app/google-services.json" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "cyhai-ci-placeholder",
              "storage_bucket": "cyhai-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.pocketpalai" }
                },
                "api_key": [ { "current_key": "CI_PLACEHOLDER_NOT_A_REAL_API_KEY" } ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          mkdir -p "$RUNNER_TEMP/pocketpal/.github/workflows" "$RUNNER_TEMP/pocketpal/scripts"
          cp "$GITHUB_WORKSPACE/.github/workflows/cyhai-android.yml" "$RUNNER_TEMP/pocketpal/.github/workflows/cyhai-android.yml"
          cp "$GITHUB_WORKSPACE/scripts/apply-cyhai-branding.sh" "$RUNNER_TEMP/pocketpal/scripts/apply-cyhai-branding.sh"
          echo "PocketPal source prepared in $RUNNER_TEMP/pocketpal"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Set up Yarn
        run: npm install --global yarn@1.22.22

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          # Avoid yes(1) receiving SIGPIPE when sdkmanager exits early.
          printf "y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n" | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/pocketpal
        run: |
          cp .env.example .env
          yarn install --frozen-lockfile

      - name: Build ARM64 Android APK
        working-directory: ${{ runner.temp }}/pocketpal
        run: |
          cd android
          ./gradlew assembleProdDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyhai-pocketpal-arm64-debug-apk
          path: android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 14
