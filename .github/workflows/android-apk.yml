name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK with llama.cpp
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Cyhai AI
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: aa75ff3239f9cc675b081697deda9e1b112345c6
          path: llama.cpp

      - name: Configure official llama.cpp Android library
        shell: bash
        run: |
          cat > llama.cpp/examples/llama.android/lib/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.arm.aichat"
              compileSdk = 36
              ndkVersion = "29.0.13113456"
              defaultConfig {
                  minSdk = 33
                  ndk { abiFilters += listOf("arm64-v8a") }
                  externalNativeBuild {
                      cmake {
                          arguments += "-DCMAKE_BUILD_TYPE=Release"
                          arguments += "-DCMAKE_MESSAGE_LOG_LEVEL=DEBUG"
                          arguments += "-DBUILD_SHARED_LIBS=ON"
                          arguments += "-DLLAMA_BUILD_APP=OFF"
                          arguments += "-DLLAMA_BUILD_COMMON=ON"
                          arguments += "-DLLAMA_OPENSSL=OFF"
                          arguments += "-DGGML_NATIVE=OFF"
                          arguments += "-DGGML_BACKEND_DL=ON"
                          arguments += "-DGGML_CPU_ALL_VARIANTS=ON"
                          arguments += "-DGGML_LLAMAFILE=OFF"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path("src/main/cpp/CMakeLists.txt")
                      version = "3.31.6"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: latest
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyhai-llama-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
